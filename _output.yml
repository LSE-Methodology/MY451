bookdown::bs4_book:
  theme:
    primary: "#005A9C"
  repo:
    base: https://github.com/LSE-Methodology/MY451
    branch: master
  css: style.css
  split_bib: true
  pandoc_args:
    - "--default-image-extension=png"
bookdown::pdf_book:
  latex_engine: pdflatex
  citation_package: natbib
  pandoc_args:
    - "--default-image-extension=pdf"
    - "--template"
    - "./pandoc-conversion-templates/template.latex"
  includes:
    in_header: preamble.tex
bookdown::epub_book:
  pandoc_args:
    - "--default-image-extension=png"
