on:
  push:
     branches:
       - master

  

name: renderbook

jobs:
  bookdown:
    name: Render-Book
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v1
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install tinytex
        run: Rscript -e 'install.packages("tinytex")'
      - name: Setup tinytex
        run: Rscript -e 'tinytex::install_tinytex()'
      - name: Install R packages
        run: Rscript -e 'install.packages(c("rmarkdown","bookdown","downlit","bslib","xml2"))'
      - name: Install required LaTeX packages
        run: Rscript -e 'tinytex::tlmgr_install(c("chapterbib","footmisc","eepic"))'
      - name: Render Book
        run: Rscript -e 'bookdown::render_book("index.Rmd")'
      - uses: actions/upload-artifact@v4
        with:
          name: _book
          path: _book/
  
# Publishes _book/ to the gh-pages branch via peaceiris/actions-gh-pages.
# Uses the built-in GITHUB_TOKEN (no PAT required); the deploy job
# needs `permissions: contents: write` to push to gh-pages.
  checkout-and-deploy:
    runs-on: ubuntu-latest
    needs: bookdown
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: _book
          path: _book
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
    
 
